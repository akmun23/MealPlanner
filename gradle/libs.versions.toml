[versions]
agp = "9.4.1"
benchmarkMacroJunit4 = "1.5.0"
bom = "3.8.0"
coilCompose = "2.7.0"
coreKtx = "1.19.1"
junit = "4.13.2"
junitVersion = "1.3.0"
ktorKtorClientCio = "3.6.0"
lifecycleRuntimeKtx = "2.11.0"
activityCompose = "1.13.0"

# Updated because Supabase 3.8.0 is built with Kotlin 2.4.x
kotlin = "2.4.21"

composeBom = "2026.09.00"
room = "2.8.5"
runner = "1.7.0"
work = "2.12.0"
androidxTestCore = "1.7.0"
robolectric = "4.17"
ksp = "2.3.12"

[libraries]
androidx-benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "benchmarkMacroJunit4" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-runner = { module = "androidx.test:runner", version.ref = "runner" }
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "junitVersion" }
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coilCompose" }
bom = { module = "io.github.jan-tennert.supabase:bom", version.ref = "bom" }
supabaseAuth = { module = "io.github.jan-tennert.supabase:auth-kt" }
supabasePostgrest = { module = "io.github.jan-tennert.supabase:postgrest-kt" }
supabaseRealtime = { module = "io.github.jan-tennert.supabase:realtime-kt" }
supabaseStorage = { module = "io.github.jan-tennert.supabase:storage-kt" }
io-ktor-ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktorKtorClientCio" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
composeMaterialIconsExtended = { module = "androidx.compose.material:material-icons-extended" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
androidx-work-testing = { group = "androidx.work", name = "work-testing", version.ref = "work" }
androidx-test-core-ktx = { group = "androidx.test", name = "core-ktx", version.ref = "androidxTestCore" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

# Needed by Supabase DTOs / JSON serialization
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }
