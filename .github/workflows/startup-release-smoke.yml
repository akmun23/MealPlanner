name: Startup release smoke

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: startup-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Create local properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "SUPABASE_URL=https://example.supabase.co" >> local.properties
          echo "SUPABASE_PUBLISHABLE_KEY=sb_publishable_build_check" >> local.properties

      - name: Run startup linkage test
        run: bash ./gradlew :app:testDebugUnitTest --tests com.example.mealplanner.StartupComponentsTest --stacktrace

      - name: Build debug APK
        run: bash ./gradlew :app:assembleDebug --stacktrace

      - name: Build release bundle
        run: bash ./gradlew :app:bundleRelease --stacktrace

      - name: Verify packaged launcher and update version
        run: |
          bash ./gradlew :app:assembleRelease --stacktrace
          MAPPING="app/build/outputs/mapping/release/mapping.txt"
          if [[ ! -s "$MAPPING" ]]; then
            echo "::error::R8 mapping.txt for the production release is missing or empty."
            exit 1
          fi
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name aapt | sort -V | tail -n 1)"
          "$AAPT" dump badging "$APK" > packaged-badging.txt
          cat packaged-badging.txt | grep -E '^package:|^launchable-activity:'
          grep -F "name='com.mealplan.mealplanner'" packaged-badging.txt
          VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*$/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$VERSION_CODE"
          grep -F "versionCode='$VERSION_CODE'" packaged-badging.txt
          grep -F "launchable-activity: name='com.example.mealplanner.MainActivity'" packaged-badging.txt
