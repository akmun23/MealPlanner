name: Android build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Pure Gradle + DEX checks: no emulator/ADB blocking the required build.
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Create local properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "SUPABASE_URL=https://example.supabase.co" >> local.properties
          echo "SUPABASE_PUBLISHABLE_KEY=sb_publishable_build_check" >> local.properties

      - name: Validate release App Bundle metadata checker
        run: python3 scripts/test_check_release_bundle_metadata.py

      - name: Run unit tests
        run: bash ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: bash ./gradlew :app:assembleDebug --stacktrace

      - name: Compile Compose UI instrumentation tests (device execution is separate)
        run: bash ./gradlew :app:assembleDebugAndroidTest --stacktrace

      - name: Build R8-optimized production release APK and Play bundle
        run: bash ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Verify Play App Bundle R8 mapping and inspect native symbols
        run: |
          set -euo pipefail
          RELEASE_BUNDLE="$(find app/build/outputs/bundle/release -maxdepth 1 -name '*.aab' -print -quit)"
          if [[ -z "$RELEASE_BUNDLE" ]]; then
            echo "::error::The production App Bundle is missing."
            exit 1
          fi
          python3 scripts/check_release_bundle_metadata.py "$RELEASE_BUNDLE"

      - name: Build unoptimized comparison APK and release-like benchmark APK
        run: bash ./gradlew :app:assembleUnoptimized :app:assembleBenchmark --stacktrace

      - name: Verify production R8 mapping and DEX reduction
        run: |
          set -euo pipefail
          RELEASE_APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          BASELINE_APK="$(find app/build/outputs/apk/unoptimized -maxdepth 1 -name '*.apk' -print -quit)"
          MAPPING="app/build/outputs/mapping/release/mapping.txt"
          if [[ ! -f "$RELEASE_APK" || ! -f "$BASELINE_APK" || ! -s "$MAPPING" ]]; then
            echo "::error::Optimized release APK, unoptimized comparison APK, and non-empty R8 mapping.txt are required."
            exit 1
          fi
          python3 scripts/check_dex_optimization.py \
            --baseline "$BASELINE_APK" \
            --optimized "$RELEASE_APK" \
            --report dex-optimization-report.json
          cat dex-optimization-report.json >> "$GITHUB_STEP_SUMMARY"

      # Emulator startup has proved unreliable on hosted runners and previously
      # stalled until the workflow was canceled. Keep build/R8 verification
      # deterministic. Emulator runtime validation is a separate, explicitly
      # opt-in workflow (.github/workflows/r8-emulator-smoke.yml).
      - name: Check optional emulator smoke script syntax
        run: bash -n scripts/smoke_optimized_apk.sh

      - name: Archive release mapping, native symbols, and shrinker metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r8-dex-report-and-mapping
          path: |
            dex-optimization-report.json
            app/build/outputs/mapping/release/mapping.txt
            app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip
            app/build/outputs/mapping/benchmark/mapping.txt
          retention-days: 14

      - name: Compile on-device benchmark harness
        run: bash ./gradlew :macrobenchmark:assembleBenchmark --stacktrace
