name: Android build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Create local properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "SUPABASE_URL=https://example.supabase.co" >> local.properties
          echo "SUPABASE_PUBLISHABLE_KEY=sb_publishable_build_check" >> local.properties

      - name: Run unit tests
        run: bash ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: bash ./gradlew :app:assembleDebug --stacktrace

      - name: Build release bundle
        run: bash ./gradlew :app:bundleRelease --stacktrace

      - name: Compile on-device benchmark harness
        run: bash ./gradlew :macrobenchmark:assembleBenchmark --stacktrace
